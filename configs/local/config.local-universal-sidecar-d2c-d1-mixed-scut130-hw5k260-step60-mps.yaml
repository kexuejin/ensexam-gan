# D2C bounded lift config for the D1 gradient-alive Universal Residual Adapter Sidecar.
#
# Development-only. This config interpolates between D2B step40 safe/no-delta
# and D2 step80 measurable-delta/source-guard-KILL using the same learning rate.
# It must not be used for product promotion, fresh blind claims, or consumed
# HW5K official-test evidence.
model:
  coarse_in_channels: 3
  refine_in_channels: 7
  cbam_reduction: 16
  universal_residual_adapter_sidecar:
    enabled: true
    adapter_count: 3
    hidden_channels: 16
    residual_bound: 0.047058823529411764  # 12/255 admitted cap
loss:
  lambda_n: [7, 8, 10, 12]
  beta_n: [0.8, 0.8, 0.8, 2.0]
  lambda_lr: 1.15
  lambda_p: 0.0416
  lambda_style: 0.01
  lambda_sn: 1.0
  lambda_b: 0.3
  normalize_lr_regions: true
  lambda_input_preserve: 13.5
  input_preserve_threshold: 0.2
  lambda_mb_leak: 0.70
  lambda_eval_outside_edit: 4.75
  lambda_eval_changed_residual: 2.15
  lambda_eval_joint_risk: 0.25
  eval_changed_threshold_px: 12.0
  eval_edit_threshold_px: 12.0
  eval_residual_threshold_px: 12.0
  eval_event_temperature_px: 0.25
  eval_outside_tail_fraction: 0.25
  eval_residual_tail_fraction: 0.25
  eval_joint_outside_alpha: 0.5
  eval_joint_tail_fraction: 0.25
train:
  epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 1
  freeze_generator_batchnorm_stats: true
  lr: 2.5e-05
  adam_betas: [0.3037, 0.9]
  device: mps
  gpu_ids: []
  num_workers: 0
  amp:
    enabled: false
  max_steps_per_epoch: 60
  save_every_n_epochs: 1
  save_latest_checkpoint: false
  save_epoch_checkpoints: true
  save_optimizer_state: false
  save_scheduler_state: false
  save_dir: ./artifacts/trials/universal-sidecar-d2c-d1-mixed-scut130-hw5k260-step60-20260806
  resume: false
  resume_path: ''
  init_checkpoint: ./artifacts/current-primary/micro_region_probe_step0001.pth
  trainable_generator_patterns:
    - '^universal_residual_adapter_sidecar\.'
  seed: 20260806
  reproducibility_mode: strict
  sampling:
    mode: page_balanced
  scheduler:
    enabled: true
    type: cosine
    eta_min: 1.0e-06
data:
  data_root: ./data-links/samples/SCUT-HW5K-mixed-20260729
  img_size: 256
  overlap: 96
  mask_threshold: 12
  # Nonzero avoids constructing a missing test split; validation is still skipped.
  val_ratio: 0.001
  train_file_list: ./hardcase_lists/mixed_scut130_hw5k260_20260729.txt
  augmentation:
    horizontal_flip_p: 0.5
    vertical_flip_p: 0.3
    rotate90_p: 0.3
    brightness_limit: 0.2
    contrast_limit: 0.2
    brightness_contrast_p: 0.5
    gauss_noise_var_limit: [10, 50]
    gauss_noise_p: 0.2
    domain_augment:
      enabled: false
inference:
  auto_scale:
    enabled: true
    reference_text_height: 16.0
    trigger_ratio: 1.05
    min_scale: 0.5
    max_scale: 1.5
    min_components: 30
evaluation:
  standalone_test_mode: none
  final_test_mode: none
  skip_final_test: true
  skip_validation: true
  page_overlap: 32
  val_every_n_epochs: 1
early_stopping:
  enabled: false
wandb:
  enabled: false
  project: ensexam_zero
  run_name: null
  log_image_every_n_epochs: 5
