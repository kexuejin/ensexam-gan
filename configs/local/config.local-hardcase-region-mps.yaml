model:
  coarse_in_channels: 3
  refine_in_channels: 7
  cbam_reduction: 16
loss:
  lambda_n:
  - 7
  - 8
  - 10
  - 12
  beta_n:
  - 0.8
  - 0.8
  - 0.8
  - 2.0
  lambda_lr: 1.15
  lambda_p: 0.0416
  lambda_style: 0.01
  lambda_sn: 1.0
  lambda_b: 0.3
  normalize_lr_regions: true
train:
  epochs: 8
  batch_size: 8
  lr: 0.00005
  adam_betas:
  - 0.3037
  - 0.9
  device: mps
  gpu_ids: []
  num_workers: 0
  save_every_n_epochs: 2
  save_dir: ./checkpoints-hardcase-region-mps
  resume: true
  resume_path: ./artifacts/full-training-best.pth
  seed: 42
  reproducibility_mode: statistical
  scheduler:
    enabled: true
    type: cosine
    eta_min: 1.0e-06
    T_0: 20
    T_mult: 2
data:
  data_root: ./data-links/samples/SCUT-EnsExam
  img_size: 256
  overlap: 96
  mask_threshold: 12
  val_ratio: 0.1
  augmentation:
    horizontal_flip_p: 0.5
    vertical_flip_p: 0.3
    rotate90_p: 0.3
    brightness_limit: 0.2
    contrast_limit: 0.2
    brightness_contrast_p: 0.5
    gauss_noise_var_limit:
    - 10
    - 50
    gauss_noise_p: 0.2
    domain_augment:
      enabled: false
      apply_on:
      - train
      p: 0.7
      stroke_insert:
        enabled: true
        p: 0.5
        mode: library
        exam_params:
          n_insert: 6
          noise_threshold: 50
          min_patch_peak: 50
          min_area: 500
          text_threshold: 210
          margin: 30
        library_params:
          library_dir: data/stroke_library
          n_insert: 10
          scale_range:
          - 0.7
          - 1.3
          angle_range:
          - -30
          - 30
          ink_color: random
          text_threshold: 210
          margin: 30
      color_augment:
        enabled: true
        p: 0.7
        mode: both
        stroke_params:
          stroke_color: random
          threshold: 15
          norm_scale: 100.0
        text_params:
          color_ratio: 0.25
          n_colors: 3
          dilation_px: 15
          min_area: 300
          text_threshold: 180
  train_file_list: ./hardcase_lists/scut_train_hard_proxy_160.txt
  val_file_list: ./hardcase_lists/scut_val_holdout_40.txt
inference:
  auto_scale:
    enabled: true
    reference_text_height: 16.0
    trigger_ratio: 1.05
    min_scale: 0.5
    max_scale: 1.5
    min_components: 30
evaluation:
  standalone_test_mode: both
  final_test_mode: none
  skip_final_test: true
  page_overlap: 32
  val_every_n_epochs: 1
early_stopping:
  enabled: true
  patience: 3
  min_delta: 0.01
  mode: max
reptile:
  meta_epochs: 500
  inner_lr: 0.0001
  inner_steps: 2
  meta_lr: 0.1
  n_tasks_per_episode: 8
  log_every_n_epochs: 10
  save_every_n_epochs: 50
  save_dir: ./checkpoints-full-mps-fast
tuning:
  n_trials: 100
  tune_epochs: 10
  init_weights: ./reptile_checkpoints/reptile_meta_init.pth
  storage: sqlite:///tuning.db
  study_name: ensexam_finetune
  search_space:
    lr:
    - 1.0e-05
    - 0.001
    beta1:
    - 0.3
    - 0.7
    lambda_p:
    - 0.01
    - 0.2
    lambda_style:
    - 0.001
    - 1
    lambda_b:
    - 0.1
    - 1.0
wandb:
  enabled: false
  project: ensexam_zero
  run_name: null
  log_image_every_n_epochs: 5
